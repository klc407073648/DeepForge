services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deepforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - cache

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URI: postgres://postgres:postgres@postgres:5432/deepforge
      PAYLOAD_SECRET: change-me-in-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - postgres
    ports:
      - "3001:3001"

  front:
    build:
      context: ./front
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - front
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
